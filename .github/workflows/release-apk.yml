name: Release Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.sh"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 34 & build-tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > /tmp/release.jks

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((10 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"

          rm -rf build && mkdir -p build/gen build/classes build/dex
          "$BT/aapt2" compile --dir app/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$PLATFORM" \
            --manifest app/AndroidManifest.xml -A app/assets --java build/gen \
            --min-sdk-version 24 --target-sdk-version 30 \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" build/res.zip

          javac -nowarn --release 11 -classpath "$PLATFORM" -d build/classes \
            $(find app/src build/gen -name '*.java')

          "$BT/d8" --min-api 24 --lib "$PLATFORM" --output build/dex $(find build/classes -name '*.class')

          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk

          "$BT/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass "env:RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "env:RELEASE_KEY_PASSWORD" \
            --out "thecatgame-v${VERSION_NAME}.apk" \
            build/aligned.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          gh release create "v${VERSION}" "thecatgame-v${VERSION}.apk" \
            --title "v${VERSION}" \
            --notes "Automated release from \`${GITHUB_SHA::7}\`: ${COMMIT_MSG}"

      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/release.jks
